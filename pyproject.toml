[project]
name = "mrpack-utils"
version = "0.0.0"
description = "Utilities for working with Modrinth-format (mrpack) Minecraft modpacks"
readme = "README.md"
authors = [
    { name = "Callie Cameron", email = "cjcameron7@gmail.com" }
]
requires-python = "==3.13.7"
dependencies = [
    "attrs==25.3.0",
    "frozendict==2.4.6",
    "requests==2.32.5",
    "tabulate==0.9.0",
]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.11",
    "requests-mock==1.12.1",
    "types-requests==2.32.4.20250809",
    "types-tabulate==0.9.0.20241207",
]

[project.scripts]
mrpack = "mrpack_utils.main:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "EM",
    "FBT",
    "PLR0913",
    "PLR0915",
    "PYI025",
    "T20",
    "TRY003",
]
