[tool.mypy]
mypy_path = "stubs"
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "EM",
    "FBT",
    "PLR0913",
    "PLR0915",
    "PYI025",
    "T20",
    "TRY003",
]

[tool.pip-tools]
generate-hashes = true
strip-extras = true
